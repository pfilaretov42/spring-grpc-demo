syntax = "proto3";

option java_multiple_files = true;
option java_package = "dev.pfilaretov42.spring.grpc.proto";
option java_outer_classname = "GreetProto";

package greet;

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
